# Integración continua (Unidad 4 — Parte 2, opción 1).
# En cada push y en cada Pull Request hacia main: instala las dependencias
# exactas del package-lock, revisa el código con ESLint, corre las pruebas
# unitarias con Vitest y compila el sitio.
# Si algo falla, el PR queda marcado en rojo antes de integrarse.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    env:
      # Cypress y Husky son herramientas locales: el pipeline no los necesita.
      CYPRESS_INSTALL_BINARY: 0
      HUSKY: 0
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          # Node 22 o superior: la misma generación que se usa en local.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Ejecutar las pruebas con cobertura (Vitest)
        run: npm run test:coverage

      - name: Guardar el informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

      - name: Compilar
        run: npm run build
        env:
          # El build no se conecta a Supabase: alcanza con valores de ejemplo.
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: clave-de-ejemplo
