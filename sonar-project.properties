# SonarCloud (Unidad 5 · orquestador centralizado del análisis estático).
# Se analiza desde el fork de Gonzac96: la organización y la clave son las que
# SonarCloud asigna al importar ese repositorio.
sonar.organization=gonzac96
sonar.projectKey=Gonzac96_Proyecto-Sistema-Universitario
sonar.projectName=Educar para Transformar

sonar.sources=src
sonar.exclusions=**/*.test.js
sonar.tests=src
sonar.test.inclusions=**/*.test.js

# Cobertura que genera `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
